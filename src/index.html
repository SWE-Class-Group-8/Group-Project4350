<!DOCTYPE html>
<html>
<head>
    <title>Agent Appetite</title>
    <style>
        body { background: #1a1a2e; color: #eee; font-family: sans-serif; text-align: center; }
        #player { width: 40px; height: 40px; background: #4ecdc4; border-radius: 50%; position: absolute; }
        #world { position: relative; height: 300px; background: #2d4a3e; margin: 20px; }
    </style>
</head>
<body>
    <h1>Agent Appetite</h1>
    <div id="world"><div id="player"></div></div>

    <script>
        const player = document.getElementById('player');
        let x = 200, y = 120;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'w') y -= 10;
            if (e.key === 's') y += 10;
            if (e.key === 'a') x -= 10;
            if (e.key === 'd') x += 10;
            player.style.left = x + 'px';
            player.style.top = y + 'px';
        });
    </script>
</body>
</html>
