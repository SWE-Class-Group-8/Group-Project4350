<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agent Appetite</title>
    <link rel="icon" href="../assets/ui/favicon/favicon_32.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu" class="stage">
        <img class="logo" src="../assets/ui/logo/agent_appetite_logo.png" alt="Agent Appetite">
        <button id="btn-login" class="imgbtn b-login" style="left:360px;top:222px" aria-label="Login"></button>
        <button id="btn-register" class="imgbtn b-register" style="left:360px;top:294px" aria-label="Register"></button>
        <button id="btn-settings" class="imgbtn b-settings" style="left:360px;top:366px" aria-label="Settings"></button>
        <button id="btn-exit" class="imgbtn b-exit" style="left:360px;top:438px" aria-label="Exit"></button>
    </div>

    <div id="auth" class="stage hidden">
        <form id="auth-form">
            <div class="box">
                <div class="title" id="auth-title">LOGIN</div>
                <input class="field" type="text" id="username" autocomplete="username" maxlength="30" aria-label="Username">
                <input class="field" type="password" id="password" autocomplete="current-password" aria-label="Password">
                <button type="button" id="auth-toggle">NO ACCOUNT?</button>
            </div>
            <p id="auth-error"></p>
            <button type="submit" id="auth-submit" class="imgbtn b-login" aria-label="Submit"></button>
        </form>
        <button id="auth-back" class="imgbtn b-back" aria-label="Back"></button>
    </div>

    <div id="settings" class="stage hidden">
        <div class="box panel9">
            <h2>SETTINGS</h2>
            <label>Audio volume <input type="range" id="set-volume" min="1" max="10" value="5"></label>
            <label>Text speed <input type="range" id="set-speed" min="1" max="10" value="5"></label>
            <label><input type="checkbox" id="set-full"> Full screen</label>
        </div>
        <button id="settings-save" class="imgbtn b-save" aria-label="Save"></button>
        <button id="settings-back" class="imgbtn b-back" aria-label="Back"></button>
    </div>

    <div id="world" class="hidden">
        <div id="hud">
            <span class="tag">PLAYER: <span id="hud-user"></span></span>
            <span class="tag">WASD MOVE &middot; E TALK &middot; M MEMORIES</span>
            <button id="btn-logout" class="imgbtn b-log-out" aria-label="Log out"></button>
        </div>
        <div id="viewport">
            <canvas id="game"></canvas>
            <div id="prompt" class="hidden"></div>
            <div id="toast" class="hidden"></div>
            <div id="thinking" class="hidden"></div>
            <div id="dialogue" class="hidden panel9">
                <div class="side">
                    <img id="dialogue-portrait" alt="">
                    <div id="dialogue-name"></div>
                </div>
                <div class="main">
                    <div id="dialogue-log"></div>
                    <form id="dialogue-form">
                        <input type="text" id="dialogue-input" placeholder="Say something..." autocomplete="off" maxlength="500">
                        <button type="submit" id="dialogue-say" class="imgbtn b-blank pixel">SAY</button>
                        <button type="button" id="dialogue-goodbye" class="imgbtn b-goodbye" aria-label="Goodbye"></button>
                    </form>
                </div>
            </div>
            <div id="memory" class="hidden panel9">
                <strong>NPC MEMORY</strong>
                <div id="memory-list"></div>
            </div>
        </div>
    </div>

    <script src="map.js"></script>
    <script src="movement.js"></script>
    <script src="sprites.js"></script>
    <script src="scene.js"></script>
    <script src="world.js"></script>
    <script src="httpApi.js"></script>
    <script src="api.js"></script>
    <script src="game.js"></script>
</body>
</html>
