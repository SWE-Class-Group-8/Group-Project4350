<!DOCTYPE html>
<html>
<head>
    <title>Agent Appetite</title>
    <style>
        body { background: #1a1a2e; color: #eee; font-family: sans-serif; text-align: center; }
        #player { width: 40px; height: 40px; background: #4ecdc4; border-radius: 50%; position: absolute; }
        #world { position: relative; height: 300px; background: #2d4a3e; margin: 20px; }
    </style>
</head>
<body>
    <h1>Agent Appetite</h1>
    <div id="world"><div id="player"></div></div>

    <script src="movement.js"></script>
    <script>
        const player = document.getElementById('player');
        const world = document.getElementById('world');
        let position = { x: 200, y: 120 };

        document.addEventListener('keydown', (e) => {
            const bounds = {
                minX: 0,
                maxX: world.clientWidth - player.offsetWidth,
                minY: 0,
                maxY: world.clientHeight - player.offsetHeight,
            };
            position = movePlayer(position, e.key, bounds);
            player.style.left = position.x + 'px';
            player.style.top = position.y + 'px';
        });
    </script>
</body>
</html>
